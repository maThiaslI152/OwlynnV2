# Lima VM config for pentest tools (Owlynn pentest mode)
# Usage: limactl start --name=owlynn-kali kali.yaml
#
# ANONYMIZED: No host-identifying information leaks to the VM.
# - No host home directory mount
# - Generic hostname
# - SSH as 'kali' user (not host user)
# - Generic SSH host key

minimumLimaVersion: 2.0.0

base:
- template:_images/debian-12

# VM resources — tuned for M4 Air 24GB
cpus: 2
memory: "2GiB"
disk: "20GiB"

# NO host mounts — prevents leaking host username, files, SSH keys
mounts: []

# SSH config — connect as 'kali' user
ssh:
  localPort: 60022
  user: "kali"

# Provision scripts — run on first boot
provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail

    export DEBIAN_FRONTEND=noninteractive

    # Set generic hostname
    hostnamectl set-hostname pentest-vm

    # Remove any host-identifying info
    rm -f /etc/machine-id /var/lib/dbus/machine-id 2>/dev/null || true
    systemd-machine-id-setup 2>/dev/null || true

    apt-get update -q
    apt-get install -y -q \
      nmap \
      sqlmap \
      hydra \
      john \
      net-tools \
      curl \
      dnsutils \
      whois \
      tcpdump \
      netcat-openbsd \
      socat \
      python3-pip \
      git \
      tmux \
      openssh-server \
      wget \
      unzip \
      sqlite3 \
      macchanger \
      nikto \
      gobuster \
      dirb \
      enum4linux \
      smbclient \
      sslscan \
      whatweb \
      seclists \
      wordlists

    # Enable and start SSH
    systemctl enable ssh
    systemctl start ssh

    # Anonymize SSH server — remove identifying info from banner
    sed -i 's/#Banner none/Banner none/' /etc/ssh/sshd_config
    sed -i 's/^DebianBanner.*/DebianBanner no/' /etc/ssh/sshd_config 2>/dev/null || echo "DebianBanner no" >> /etc/ssh/sshd_config
    systemctl restart ssh

    # Create kali user with passwordless sudo
    useradd -m -s /bin/bash kali || true
    echo "kali ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/kali
    chmod 440 /etc/sudoers.d/kali

    # Set up SSH key auth for kali user
    mkdir -p /home/kali/.ssh
    if [ -f /root/.ssh/authorized_keys ]; then
      cp /root/.ssh/authorized_keys /home/kali/.ssh/authorized_keys
    fi
    chown -R kali:kali /home/kali/.ssh
    chmod 700 /home/kali/.ssh
    [ -f /home/kali/.ssh/authorized_keys ] && chmod 600 /home/kali/.ssh/authorized_keys

    # Generic tmux config — no identifying info
    cat > /home/kali/.tmux.conf << 'TMUX'
    set -g default-terminal "screen-256color"
    set -g history-limit 10000
    set -g mouse on
    set -g set-titles off
    TMUX
    chown kali:kali /home/kali/.tmux.conf

    # Unzip rockyou wordlist if it exists
    if [ -f /usr/share/wordlists/rockyou.txt.gz ]; then
      gzip -d /usr/share/wordlists/rockyou.txt.gz
    fi

    # Clean up apt cache and logs
    apt-get clean
    rm -rf /var/lib/apt/lists/*
    rm -f /var/log/*.log /var/log/*.gz
    history -c 2>/dev/null || true

    echo "Pentest VM provisioning complete."

- mode: user
  script: |
    #!/bin/bash
    # Start a default tmux session named "main"
    tmux new-session -d -s main -n shell 2>/dev/null || true

# Probes
probes:
- script: |
    #!/bin/bash
    set -eux -o pipefail
    systemctl is-active ssh
    tmux has-session -t main
  hint: |
    SSH and tmux session must be running.

# Host resolver
hostResolver:
  enabled: true
