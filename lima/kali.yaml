# Lima VM config for pentest tools (Owlynn pentest mode)
# Usage: limactl start --name=owlynn-kali kali.yaml
#
# Uses Debian 12 with pentest tools from Debian repos + pip.
# No Kali repo mixing to avoid dependency conflicts.

minimumLimaVersion: 2.0.0

base:
- template:_images/debian-12
- template:_default/mounts

# VM resources — tuned for M4 Air 24GB
cpus: 2
memory: "2GiB"
disk: "20GiB"

# Mount the Owlynn workspace into the VM
mounts:
- location: "~"

# SSH config
ssh:
  localPort: 60022

# Provision scripts — run on first boot
provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail

    export DEBIAN_FRONTEND=noninteractive

    apt-get update -q
    apt-get install -y -q \
      nmap \
      sqlmap \
      hydra \
      john \
      net-tools \
      curl \
      dnsutils \
      whois \
      tcpdump \
      netcat-openbsd \
      socat \
      python3-pip \
      git \
      tmux \
      openssh-server \
      wget \
      unzip \
      sqlite3

    # Enable and start SSH
    systemctl enable ssh
    systemctl start ssh

    # Create kali user with passwordless sudo
    useradd -m -s /bin/bash kali || true
    echo "kali ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/kali
    chmod 440 /etc/sudoers.d/kali

    # Set up SSH key auth for kali user
    mkdir -p /home/kali/.ssh
    if [ -f /root/.ssh/authorized_keys ]; then
      cp /root/.ssh/authorized_keys /home/kali/.ssh/authorized_keys
    fi
    chown -R kali:kali /home/kali/.ssh
    chmod 700 /home/kali/.ssh
    [ -f /home/kali/.ssh/authorized_keys ] && chmod 600 /home/kali/.ssh/authorized_keys

    # Create tmux config
    cat > /home/kali/.tmux.conf << 'TMUX'
    set -g default-terminal "screen-256color"
    set -g history-limit 10000
    set -g mouse on
    TMUX
    chown kali:kali /home/kali/.tmux.conf

    echo "Pentest VM provisioning complete."

- mode: user
  script: |
    #!/bin/bash
    # Start a default tmux session named "main"
    tmux new-session -d -s main -n shell 2>/dev/null || true

# Probes
probes:
- script: |
    #!/bin/bash
    set -eux -o pipefail
    systemctl is-active ssh
    tmux has-session -t main
  hint: |
    SSH and tmux session must be running.

# Host resolver
hostResolver:
  enabled: true
