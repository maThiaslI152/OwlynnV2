version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: owlynn_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: owlynn_searxng
    profiles:
      - searxng
    ports:
      - "8888:8080"
    volumes:
      - searxng_data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: owlynn_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 512m

  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: owlynn_stirling_pdf
    ports:
      - "8090:8080"
    volumes:
      - stirling_tessdata:/usr/share/tessdata
      - stirling_configs:/configs
      - stirling_logs:/logs
    environment:
      - SECURITY_ENABLELOGIN=false
      - SECURITY_CUSTOMGLOBALAPIKEY=${STIRLING_PDF_API_KEY:-owlynn-local-dev}
      - LANGS=en_GB
    restart: unless-stopped
    mem_limit: 1g

volumes:
  qdrant_data:
  searxng_data:
  redis_data:
  stirling_tessdata:
  stirling_configs:
  stirling_logs:
