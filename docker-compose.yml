version: '3.8'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: owlynn_searxng
    profiles:
      - searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - searxng_data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888
    restart: unless-stopped

  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: owlynn_stirling_pdf
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - stirling_tessdata:/usr/share/tessdata
      - stirling_configs:/configs
      - stirling_logs:/logs
    environment:
      - SECURITY_ENABLELOGIN=false
      - SECURITY_CUSTOMGLOBALAPIKEY=${STIRLING_PDF_API_KEY:-owlynn-local-dev}
      - LANGS=en_GB
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx512m
    restart: unless-stopped
    mem_limit: 2g

  postgres:
    image: pgvector/pgvector:pg15
    container_name: owlynn_postgres
    environment:
      POSTGRES_USER: owlynn
      POSTGRES_PASSWORD: owlynn_password
      POSTGRES_DB: owlynn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    container_name: owlynn_backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SEARXNG_URL=http://owlynn_searxng:8080
      - STIRLING_PDF_URL=http://owlynn_stirling_pdf:8080
      - DATABASE_URL=postgresql+asyncpg://owlynn:owlynn_password@owlynn_postgres:5432/owlynn
      - SMALL_LLM_BASE_URL=http://host.docker.internal:1234/v1
      - CLOUD_LLM_BASE_URL=http://host.docker.internal:1234/v1
      - OWLYNN_DATA_DIR=/app/data
      - OWLYNN_WORKSPACE_DIR=/app/workspace
      - OWLYNN_AUDIT_LOG_DIR=/root/.owlynn/logs
      - OWLYNN_TRACE_DIR=/root/.owlynn/traces
      - OWLYNN_NO_PRELOAD=1
    volumes:
      - owlynn_data:/app/data
      - owlynn_workspace:/app/workspace
      - ~/.owlynn/logs:/root/.owlynn/logs
      - ~/.owlynn/traces:/root/.owlynn/traces
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  searxng_data:
  stirling_tessdata:
  stirling_configs:
  stirling_logs:
  owlynn_data:
  owlynn_workspace:
  postgres_data:
