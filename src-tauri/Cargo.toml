[package]
name = "owlynn"
version = "0.1.0"
description = "Owlynn Desktop App"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "window-start-dragging", "shell-open", "macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
window-vibrancy = "0.4"
objc = "0.2"
block = "0.1"
cocoa = "0.26"
core-foundation = "0.10"
coreaudio-rs = "0.11"
crossbeam-channel = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
